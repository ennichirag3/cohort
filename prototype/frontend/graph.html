<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why The Code Is Like This - Graph Explorer</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    .graph-card {
      width: 100%;
      max-height: 680px;
      min-height: clamp(360px, 60vh, 520px);
      position: relative;
      overflow: auto;
      display: block;
    }

    .graph-summary {
      margin: 12px 4px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .node-details {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px 16px;
      align-items: start;
    }

    .node-details.hidden {
      display: none;
    }

    .node-details h2,
    .node-details .detail-body,
    .node-details .detail-meta,
    .node-details .detail-link {
      grid-column: 1 / -1;
    }

    .node-details h2 {
      font-size: 1.1rem;
      overflow-wrap: anywhere;
    }

    .node-details .detail-body {
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .node-details .detail-meta {
      color: var(--text-muted);
      font-size: 0.85rem;
      overflow-wrap: anywhere;
    }

    .detail-close {
      grid-column: 2;
      grid-row: 1;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      padding: 4px 10px;
      cursor: pointer;
    }
    
    svg.graph-svg {
      width: 100%;
      min-width: 720px;
      height: auto;
      display: block;
    }

    .node-group {
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .node-group:hover {
      filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.6));
    }

    .node-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      fill: #ffffff;
      pointer-events: none;
    }

    .node-subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #cbd5e1;
      pointer-events: none;
    }

    .mono-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .edge-line {
      stroke: rgba(148, 163, 184, 0.28);
      stroke-width: 1.25;
    }

    .edge-badge {
      fill: #0d0c1d;
      stroke: rgba(255, 255, 255, 0.18);
      stroke-width: 1;
      rx: 4px;
    }

    .edge-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      fill: #a1a1aa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
    }
    @media (max-width: 720px) { .graph-card { max-height: 65vh; padding: 1rem; } svg.graph-svg { min-width: 600px; } .node-details { grid-template-columns: minmax(0, 1fr) auto; } }
    @media (max-width: 420px) { svg.graph-svg { min-width: 520px; } .graph-card { min-height: 340px; } }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-container">
    <nav class="navbar">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">CODE<b>INSIGHT</b></span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item">Evidence Engine</a>
        <a href="graph.html" class="nav-item active">Graph Explorer</a>
        <a href="docs.html" class="nav-item">Documentation</a>
      </div>
    </nav>

    <main class="hero-section">
      <div class="hero-header">
        <span class="tag-badge">GRAPH VISUALIZER</span>
        <h1 class="hero-title">Knowledge Graph Topology</h1>
        <p class="hero-subtitle">Interactively explore historical commits, architectural decisions, and pull request dependencies.</p>
      </div>

      <div class="glass-card graph-card">
        <svg id="graphSvg" class="graph-svg" viewBox="0 0 800 450">
          <defs>
            <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <p id="graphSummary" class="graph-summary" aria-live="polite"></p>

      <section id="nodeDetails" class="glass-card node-details hidden" aria-live="polite">
        <span id="detailType" class="source-tag">Select a node</span>
        <button id="detailClose" class="detail-close" type="button" aria-label="Close details">Close</button>
        <h2 id="detailTitle"></h2>
        <p id="detailId" class="detail-meta"></p>
        <p id="detailAuthorDate" class="detail-meta"></p>
        <p id="detailBody" class="detail-body"></p>
        <a id="detailLink" class="source-link hidden" target="_blank" rel="noopener noreferrer">Open GitHub source →</a>
      </section>
    </main>
  </div>

  <script>
    function truncateText(value, maxLength = 18) {
      const text = String(value || '');
      return text.length > maxLength ? text.substring(0, maxLength - 3) + '...' : text;
    }

    function escapeSvgText(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&apos;'
      })[character]);
    }

    function shortNodeLabel(node) {
      const details = node.details || {};
      const stableId = String(details.id || node.label || '');

      if (node.type === 'Commit') {
        const sha = stableId.includes('@') ? stableId.split('@').pop() : stableId;
        return `Commit ${sha.slice(0, 7)}`;
      }

      if (node.type === 'File') {
        const path = String(details.path || stableId.split(':').slice(1).join(':') || node.label || 'File');
        const parts = path.split(/[\\/]/).filter(Boolean);
        const shortPath = parts.length > 2 ? `…/${parts.slice(-2).join('/')}` : path;
        return truncateText(shortPath, 25);
      }

      if (node.type === 'PullRequest' || node.type === 'PR') {
        const number = stableId.includes('#') ? stableId.split('#').pop() : stableId;
        return `PR #${number}`;
      }

      if (node.type === 'Issue') {
        const number = stableId.includes('#') ? stableId.split('#').pop() : stableId;
        return `Issue #${number}`;
      }

      return truncateText(node.label || node.name || stableId, 22);
    }

    function safeGitHubUrl(value) {
      try {
        const url = new URL(value);
        if (url.protocol === 'https:' && url.hostname === 'github.com') {
          return url.href;
        }
      } catch {
        // Leave the link hidden when the URL is invalid.
      }
      return '';
    }

    function showNodeDetails(node) {
      const panel = document.getElementById('nodeDetails');
      const details = node.details || {};
      const sourceLink = document.getElementById('detailLink');
      const url = safeGitHubUrl(details.url);

      document.getElementById('detailType').textContent = node.type || 'Graph node';
      document.getElementById('detailTitle').textContent = details.path || node.label || node.type || 'Graph node';
      document.getElementById('detailId').textContent = `ID: ${details.id || node.id}`;
      document.getElementById('detailAuthorDate').textContent =
        `Author: ${details.author || 'Unknown'}${details.date ? ` • ${details.date}` : ''}`;
      document.getElementById('detailBody').textContent = details.text || 'No additional text is stored for this node.';

      if (url) {
        sourceLink.href = url;
        sourceLink.classList.remove('hidden');
      } else {
        sourceLink.removeAttribute('href');
        sourceLink.classList.add('hidden');
      }

      panel.classList.remove('hidden');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function loadGraphTopology() {
      try {
        // Focus Graph Explorer on the repository from the last successful import.
        // Without a selection, load the default graph for existing data.
        const selectedRepository = localStorage.getItem('lastImportedRepository') || '';
        const graphUrl = new URL('https://repoinsight-qjj0.onrender.com/api/graph')
        if (selectedRepository) graphUrl.searchParams.set('q', selectedRepository);
        const response = await fetch(graphUrl);
        if (!response.ok) {
          throw new Error(`Backend returned HTTP ${response.status}`);
        }
        const data = await response.json();
        const svg = document.getElementById('graphSvg');

        const nodes = data.nodes || [];
        const edges = data.edges || [];

        if (nodes.length === 0 || edges.length === 0) {
          svg.innerHTML = `
            <text x="480" y="210" text-anchor="middle" fill="#a1a1aa" font-family="Plus Jakarta Sans" font-size="14">
              The backend is connected, but this graph has no relationships to draw.
            </text>
            <text x="480" y="240" text-anchor="middle" fill="#a1a1aa" font-family="Plus Jakarta Sans" font-size="12">
              Import a repository from the Evidence Engine, then refresh this page.
            </text>`;
          document.getElementById('graphSummary').textContent =
            `Backend returned ${nodes.length} nodes and ${edges.length} relationships.`;
          return;
        }

        // Keep the sample balanced. The raw API list starts with many
        // Repository -> Commit links, which otherwise overwhelm the view.
        const nodeById = new Map(nodes.map(node => [node.id, node]));
        const typeLimits = {
          Repository: 2,
          Commit: 6,
          PullRequest: 3,
          PR: 3,
          Issue: 3,
          Developer: 2,
          File: 4,
        };
        const visibleIds = new Set();
        const visibleEdges = [];
        const countsByType = new Map();
        const relationCounts = new Map();
        const visibleNodes = [];

        function addNode(id) {
          if (visibleIds.has(id)) return true;
          const node = nodeById.get(id);
          if (!node || visibleNodes.length >= 24) return false;
          const type = node.type || 'Other';
          const limit = typeLimits[type] ?? 4;
          const count = countsByType.get(type) || 0;
          if (count >= limit) return false;
          visibleIds.add(id);
          visibleNodes.push(node);
          countsByType.set(type, count + 1);
          return true;
        }

        // Keep repository context visible, but choose only a few of its commits.
        nodes.filter(node => node.type === 'Repository').slice(0, 2).forEach(node => addNode(node.id));

        const relationPriority = {
          INCLUDES_COMMIT: 0,
          REFERENCES_ISSUE: 0,
          CHANGED: 1,
          AUTHORED_BY: 2,
          HAS_COMMIT: 3,
        };
        const relationLimits = {
          INCLUDES_COMMIT: 3,
          REFERENCES_ISSUE: 3,
          CHANGED: 4,
          AUTHORED_BY: 2,
          HAS_COMMIT: 2,
        };
        const prioritizedEdges = [...edges].sort((a, b) =>
          (relationPriority[a.relation] ?? 2) - (relationPriority[b.relation] ?? 2)
        );

        for (const edge of prioritizedEdges) {
          const relationCount = relationCounts.get(edge.relation) || 0;
          if (relationCount >= (relationLimits[edge.relation] ?? 3)) continue;

          const newIds = [edge.source, edge.target].filter(id => !visibleIds.has(id));
          const canAdd = newIds.every(id => {
            const node = nodeById.get(id);
            if (!node) return false;
            const type = node.type || 'Other';
            const limit = typeLimits[type] ?? 4;
            return (countsByType.get(type) || 0) < limit;
          });
          if (!canAdd || visibleNodes.length + newIds.length > 24) continue;

          addNode(edge.source);
          addNode(edge.target);
          visibleEdges.push(edge);
          relationCounts.set(edge.relation, relationCount + 1);
        }

        // Draw each relationship once even if the API returned duplicates.
        const uniqueEdges = [...new Map(visibleEdges.map(edge =>
          [`${edge.source}|${edge.relation}|${edge.target}`, edge]
        )).values()];
        const typeOrder = ['Repository', 'Commit', 'PullRequest', 'PR', 'Issue', 'Developer', 'File'];
        const groups = new Map();
        visibleNodes.forEach(node => {
          const type = node.type || 'Other';
          if (!groups.has(type)) groups.set(type, []);
          groups.get(type).push(node);
        });
        const types = [...groups.keys()].sort((a, b) => {
          const ai = typeOrder.indexOf(a);
          const bi = typeOrder.indexOf(b);
          return (ai === -1 ? typeOrder.length : ai) - (bi === -1 ? typeOrder.length : bi) || a.localeCompare(b);
        });

        const width = Math.max(960, types.length * 210 + 40);
        const laneWidth = (width - 40) / types.length;
        const height = Math.max(480, Math.max(...types.map(type => groups.get(type).length), 1) * 84 + 110);
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.style.width = '100%';
        svg.style.height = 'auto';
        const coords = {};
        const columnCenters = {};
        types.forEach((type, columnIndex) => {
          const x = 20 + columnIndex * laneWidth + laneWidth / 2;
          columnCenters[type] = x;
          groups.get(type).forEach((node, rowIndex) => {
            coords[node.id] = { x, y: 96 + rowIndex * 84 };
          });
        });

        let svgContent = `
          <defs>
            <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
          </defs>
          <text x="20" y="28" class="edge-text">NODES GROUPED BY TYPE · CLICK A NODE FOR DETAILS</text>`;

        // Type lanes keep node cards separated; faint lines preserve the relationships.
        types.forEach(type => {
          const count = groups.get(type).length;
          svgContent += `<text x="${columnCenters[type]}" y="62" text-anchor="middle" class="node-subtitle">${escapeSvgText(type)} (${count})</text>`;
        });

        uniqueEdges.forEach(edge => {
          const p1 = coords[edge.source];
          const p2 = coords[edge.target];
          if (p1 && p2) {
            svgContent += `<line class="edge-line" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" />`;
          }
        });

        visibleNodes.forEach(node => {
          const pos = coords[node.id];
          const displayLabel = escapeSvgText(shortNodeLabel(node));

          if (node.type === "Decision") {
            const detailText = truncateText(node.details?.text || '', 16);
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <circle r="50" fill="url(#purpleGradient)" stroke="#c084fc" stroke-width="2"/>
                <text x="0" y="${detailText ? '-4' : '4'}" text-anchor="middle" class="node-title">${displayLabel}</text>
                ${detailText ? `<text x="0" y="12" text-anchor="middle" class="node-subtitle">${detailText}</text>` : ''}
              </g>`;
          } else if (node.type === "Commit") {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-82" y="-23" width="164" height="46" rx="12" fill="#13102d" stroke="#6366f1" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title mono-text" fill="#a5b4fc">${displayLabel}</text>
              </g>`;
          } else if (node.type === "PullRequest" || node.type === "PR") {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-82" y="-23" width="164" height="46" rx="12" fill="#082f25" stroke="#10b981" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title" fill="#6ee7b7">${displayLabel}</text>
              </g>`;
          } else if (node.type === "Index") {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-82" y="-23" width="164" height="46" rx="12" fill="#2e1505" stroke="#f59e0b" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title" fill="#fde047">${displayLabel}</text>
              </g>`;
          } else {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-82" y="-23" width="164" height="46" rx="12" fill="#240c38" stroke="#a855f7" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title mono-text" fill="#e9d5ff">${displayLabel}</text>
              </g>`;
          }
        });

        svg.innerHTML = svgContent;

        svg.querySelectorAll('.node-group').forEach((element, index) => {
          element.addEventListener('click', () => showNodeDetails(visibleNodes[index]));
          element.setAttribute('tabindex', '0');
          element.setAttribute('role', 'button');
          element.setAttribute('aria-label', `Show details for ${shortNodeLabel(visibleNodes[index])}`);
          element.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              showNodeDetails(visibleNodes[index]);
            }
          });
        });

        const graphLabel = selectedRepository ? ` for ${selectedRepository}` : '';
        document.getElementById('graphSummary').textContent =
          `Showing a balanced sample${graphLabel}: ${visibleNodes.length} of ${nodes.length} nodes and ${uniqueEdges.length} of ${edges.length} relationships. Click a node for details.`;
      } catch (err) {
        console.error("Failed to load graph topology from backend:", err);
        const svg = document.getElementById('graphSvg');
        svg.innerHTML = `
          <text x="480" y="210" text-anchor="middle" fill="#fca5a5" font-family="Plus Jakarta Sans" font-size="14">
            Could not load the graph. Check that the backend is running, then refresh.
          </text>
          <text x="480" y="240" text-anchor="middle" fill="#a1a1aa" font-family="Plus Jakarta Sans" font-size="12">
            ${escapeSvgText(err.message || 'Unknown error')}
          </text>`;
        document.getElementById('graphSummary').textContent = '';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('detailClose').addEventListener('click', () => {
        document.getElementById('nodeDetails').classList.add('hidden');
      });
      loadGraphTopology();
    });
  </script>
</body>
</html>
