<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why The Code Is Like This - Graph Explorer</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    .graph-card {
      width: 100%;
      height: 520px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    svg.graph-svg {
      width: 100%;
      height: 100%;
    }

    .node-group {
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .node-group:hover {
      filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.5));
    }

    .node-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      fill: #ffffff;
      pointer-events: none;
    }

    .node-subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #cbd5e1;
      pointer-events: none;
    }

    .mono-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .edge-line {
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    .edge-badge {
      fill: #0d0c1d;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 1;
      rx: 4px;
    }

    .edge-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      fill: #a1a1aa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-container">
    <nav class="navbar">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">CODE<b>INSIGHT</b></span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item">Evidence Engine</a>
        <a href="graph.html" class="nav-item active">Graph Explorer</a>
        <a href="http://127.0.0.1:8000/docs" target="_blank" rel="noopener noreferrer" class="nav-item">Documentation</a>
      </div>
    </nav>

    <main class="hero-section">
      <div class="hero-header">
        <span class="tag-badge">GRAPH VISUALIZER</span>
        <h1 class="hero-title">Knowledge Graph Topology</h1>
        <p class="hero-subtitle">Interactively explore historical commits, architectural decisions, and pull request dependencies.</p>
      </div>

      <div class="glass-card graph-card">
        <svg id="graphSvg" class="graph-svg" viewBox="0 0 800 450">
          <defs>
            <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </main>
  </div>

  <script>
    async function loadGraphTopology() {
      try {
        // Read dynamic query context from window.name
        const activeQuery = window.name ? window.name.trim() : "";
        let apiUrl = 'http://127.0.0.1:8000/api/graph';
        if (activeQuery) {
          apiUrl += `?q=${encodeURIComponent(activeQuery)}`;
        }

        const response = await fetch(apiUrl);
        const data = await response.json();
        
        const svg = document.getElementById('graphSvg');
        
        const coords = {
          "decision_1": { x: 400, y: 225 },
          "commit_1": { x: 220, y: 120 },
          "pr_1": { x: 580, y: 120 },
          "index_1": { x: 250, y: 330 },
          "file_1": { x: 550, y: 330 }
        };

        const edgeBadges = [
          { source: "decision_1", target: "commit_1", label: "JUSTIFIED_BY", tx: 310, ty: 172, w: 84 },
          { source: "decision_1", target: "pr_1", label: "IMPLEMENTED_IN", tx: 490, ty: 172, w: 96 },
          { source: "decision_1", target: "index_1", label: "STORED_IN", tx: 325, ty: 278, w: 76 },
          { source: "decision_1", target: "file_1", label: "DEPENDS_ON", tx: 475, ty: 278, w: 76 }
        ];

        let svgContent = `<defs>
          <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#3b82f6" />
          </linearGradient>
        </defs>`;

        edgeBadges.forEach(edge => {
          const p1 = coords[edge.source];
          const p2 = coords[edge.target];
          if (p1 && p2) {
            svgContent += `<line class="edge-line" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" />`;
          }
        });

        edgeBadges.forEach(edge => {
          svgContent += `
            <g transform="translate(${edge.tx}, ${edge.ty})">
              <rect x="${-edge.w/2}" y="-9" width="${edge.w}" height="18" class="edge-badge" />
              <text x="0" y="3" text-anchor="middle" class="edge-text">${edge.label}</text>
            </g>`;
        });

        // Use backend data nodes dynamically
        const nodesToRender = (data.nodes && data.nodes.length > 0) ? data.nodes : [];

        nodesToRender.forEach((node, index) => {
          const pos = coords[node.id] || { x: 200 + (index * 100), y: 225 };
          const labelText = node.label || node.id;
          const detailText = node.detail || '';
          
          if (node.type === "Decision") {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <circle r="52" fill="url(#purpleGradient)" stroke="#c084fc" stroke-width="2"/>
                <text x="0" y="-6" text-anchor="middle" class="node-title" font-size="14">${labelText}</text>
                <text x="0" y="12" text-anchor="middle" class="node-subtitle">${detailText}</text>
              </g>`;
          } else if (node.type === "Commit") {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-75" y="-24" width="150" height="48" rx="12" fill="#13102d" stroke="#6366f1" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title mono-text" fill="#a5b4fc">${labelText}</text>
              </g>`;
          } else if (node.type === "PullRequest") {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-75" y="-24" width="150" height="48" rx="12" fill="#082f25" stroke="#10b981" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title" fill="#6ee7b7">${labelText}</text>
              </g>`;
          } else if (node.type === "Index") {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-75" y="-24" width="150" height="48" rx="12" fill="#2e1505" stroke="#f59e0b" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title" fill="#fde047">${labelText}</text>
              </g>`;
          } else {
            svgContent += `
              <g class="node-group" transform="translate(${pos.x}, ${pos.y})">
                <rect x="-75" y="-24" width="150" height="48" rx="12" fill="#240c38" stroke="#a855f7" stroke-width="1.5"/>
                <text x="0" y="4" text-anchor="middle" class="node-title mono-text" fill="#e9d5ff">${labelText}</text>
              </g>`;
          }
        });

        svg.innerHTML = svgContent;
      } catch (err) {
        console.error("Failed to load graph topology from backend:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadGraphTopology();
    });
  </script>
</body>
</html>
